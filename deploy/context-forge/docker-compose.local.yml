# Overlay that builds the clops agents from a locally-built wheel.
#
#   uv build && mkdir -p deploy/context-forge/wheels \
#     && cp dist/clops_mcp-*.whl deploy/context-forge/wheels/
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Use this while the repo is private, or to test an uncommitted change. The base
# compose file installs from git and needs neither.
#
# Both agents share one image, so only the first build actually compiles; the
# second is a cache hit.

x-local-build: &local-build
  build:
    dockerfile: Dockerfile.clops.local
    # The base file passes CLOPS_SPEC, which this Dockerfile has no ARG for.
    # Compose merges `args` by key rather than replacing the map, so it has to
    # be cleared explicitly or the build fails on an unconsumed build-arg.
    args: !reset null

services:
  clops-support:
    <<: *local-build
  clops-session:
    <<: *local-build
