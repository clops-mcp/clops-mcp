[build-system]
# setuptools>=77 for PEP 639 `license`/`license-files` (SPDX expression form).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI. The import package and CLI stay `clops`
# (`clops` on PyPI is an unrelated package, so the distribution is `clops-mcp`).
name = "clops-mcp"
version = "0.3.0"
description = "A runtime for LLM-bodied functions, exposed to Claude Code via MCP."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Wesley Harding" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "mcp",
    "model-context-protocol",
    "claude",
    "claude-code",
    "llm",
    "agents",
    "orchestration",
    "pipeline",
    "workflow",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Upper bound is load-bearing: mcp 2.0.0 (2026-07-28) removed the low-level
    # `Server.list_tools` decorator API that runtime/mcp_server.py registers
    # with, so 2.x fails at server construction. uv.lock pins 1.27.0, which is
    # why `uv sync` developers never saw it — but a fresh `uvx --from git+...`
    # resolves from this file and picked up the break. Revisit as a deliberate
    # migration, not a float.
    "mcp>=1.27,<2",
    "tinydb>=4.8",
]

[project.urls]
Homepage = "https://github.com/clops-mcp/clops-mcp"
Repository = "https://github.com/clops-mcp/clops-mcp"
Documentation = "https://github.com/clops-mcp/clops-mcp/tree/main/docs"
Issues = "https://github.com/clops-mcp/clops-mcp/issues"
Changelog = "https://github.com/clops-mcp/clops-mcp/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio",
    "pytest-cov",
]

[project.scripts]
clops = "clops.cli.main:main"
clops-server = "clops.runtime.mcp_server:main"
clops-hook = "clops.cli.hook:main"
# `uvx <name>` installs package <name> and then runs an executable *also* called
# <name>. Without this alias `uvx clops-mcp` fails outright — uv lists the three
# scripts above and tells you to use `uvx --from clops-mcp <script>` instead.
# Worse, the obvious next guess, `uvx clops`, installs an unrelated `clops`
# project from PyPI that is not this one.
#
# It points at the server rather than the CLI because the reason to `uvx` an MCP
# package is to launch it from a client config:
#   {"command": "uvx", "args": ["clops-mcp", "--library", "my_ops"]}
clops-mcp = "clops.runtime.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
# `clops` only. `examples*` used to be listed here, which installed a top-level
# `examples` package into every user's site-packages — a name collision waiting
# to happen. The example library still ships in the sdist (see MANIFEST.in) and
# is importable in the test run via `pythonpath` below.
include = ["clops*"]

[tool.setuptools.package-data]
"clops._plugin" = [
    "agents/*.md",
    "skills/*/SKILL.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `examples` is no longer an installed package, but several tests lint/show
# `examples.my_company`. Put the source root on sys.path for the test run.
pythonpath = ["."]
