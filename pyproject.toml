[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI. The import package and CLI stay `clops`
# (`clops` on PyPI is an unrelated package, so the distribution is `clops-mcp`).
name = "clops-mcp"
version = "0.3.0"
description = "A runtime for LLM-bodied functions, exposed to Claude Code via MCP."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Wesley Harding" }]
# TODO(license): no LICENSE file exists in this repo yet. Pick one before
# publishing and then uncomment both lines below (SPDX expression + the file
# to ship in the sdist/wheel). PyPI accepts a release without a license, but
# "no license" legally means all rights reserved — nobody may use it.
#   license = "MIT"
#   license-files = ["LICENSE"]
keywords = [
    "mcp",
    "model-context-protocol",
    "claude",
    "claude-code",
    "llm",
    "agents",
    "orchestration",
    "pipeline",
    "workflow",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Upper bound is load-bearing: mcp 2.0.0 (2026-07-28) removed the low-level
    # `Server.list_tools` decorator API that runtime/mcp_server.py registers
    # with, so 2.x fails at server construction. uv.lock pins 1.27.0, which is
    # why `uv sync` developers never saw it — but a fresh `uvx --from git+...`
    # resolves from this file and picked up the break. Revisit as a deliberate
    # migration, not a float.
    "mcp>=1.27,<2",
    "tinydb>=4.8",
]

[project.urls]
Homepage = "https://github.com/wesley-harding/clops"
Repository = "https://github.com/wesley-harding/clops"
Documentation = "https://github.com/wesley-harding/clops/tree/main/docs"
Issues = "https://github.com/wesley-harding/clops/issues"
Changelog = "https://github.com/wesley-harding/clops/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio",
    "pytest-cov",
]

[project.scripts]
clops = "clops.cli.main:main"
clops-server = "clops.runtime.mcp_server:main"
clops-hook = "clops.cli.hook:main"

[tool.setuptools.packages.find]
where = ["."]
# `clops` only. `examples*` used to be listed here, which installed a top-level
# `examples` package into every user's site-packages — a name collision waiting
# to happen. The example library still ships in the sdist (see MANIFEST.in) and
# is importable in the test run via `pythonpath` below.
include = ["clops*"]

[tool.setuptools.package-data]
"clops._plugin" = [
    "agents/*.md",
    "skills/*/SKILL.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `examples` is no longer an installed package, but several tests lint/show
# `examples.my_company`. Put the source root on sys.path for the test run.
pythonpath = ["."]
