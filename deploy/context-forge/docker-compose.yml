# Minimal clops-behind-a-gateway stack.
#
# Deliberately NOT the full ContextForge compose (Postgres + Redis + nginx +
# pgAdmin). This is enough to prove the shape, and SQLite is a documented
# single-node configuration. Add Postgres/Redis when you run more than one
# gateway replica.
#
#   gateway         ContextForge — the only thing exposed to the host
#   clops-support   clops agent serving business_designer   (internal only)
#   clops-session   clops agent serving session_analyzer    (internal only)
#
# Two agents rather than one on purpose: the point of the design is different
# Op sets per container, not replicas. Both run the same image and differ by a
# single environment variable.

# Everything an agent needs except which library it serves. The two agents below
# are identical apart from CLOPS_LIBRARY — that is the whole claim.
x-clops-agent: &clops-agent
  image: clops-agent:local
  build:
    context: .
    dockerfile: Dockerfile.clops
    args:
      # Point at a tag/branch, or `clops-mcp==0.3.0` once published.
      CLOPS_SPEC: ${CLOPS_SPEC:-git+https://github.com/wesley-harding/clops}
  # No `ports:` on purpose. Agents are reachable only by the gateway, over the
  # compose network. Publishing one to the host would put an unauthenticated
  # write path into run state on your network — see docs/deployment-research.md §2.
  expose:
    - "9000"
  restart: unless-stopped

services:
  gateway:
    image: ghcr.io/ibm/mcp-context-forge:latest
    ports:
      - "4444:4444"
    environment:
      # Both are required — the gateway refuses to start without them.
      # Generate with: python3 -m mcpgateway.scripts.init_secrets
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      AUTH_ENCRYPTION_SECRET: ${AUTH_ENCRYPTION_SECRET:?set AUTH_ENCRYPTION_SECRET in .env}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@example.com}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?set PLATFORM_ADMIN_PASSWORD in .env}
      MCPGATEWAY_UI_ENABLED: "true"
      MCPGATEWAY_ADMIN_API_ENABLED: "true"
      HOST: "0.0.0.0"
      PORT: "4444"
      # Off by default, and should stay off anywhere real — it returns
      # exception detail to the caller. Flip it in .env when you need to debug:
      # without it every 4xx is the same opaque "An error occurred, please try
      # again.", and the access log is /dev/null, so there is nothing to go on.
      EXPOSE_ERROR_DETAILS: ${EXPOSE_ERROR_DETAILS:-false}
      # Without this, registering the agent fails with a 422:
      #   "Gateway URL contains private network address which is blocked by
      #    SSRF protection"
      # The gateway blocks RFC 1918 destinations by default, which would block
      # this entire design — agents are supposed to be reachable only on the
      # internal network. Allowlisting the one compose subnet is the narrow fix;
      # SSRF_ALLOW_PRIVATE_NETWORKS=true is the blunt one, and it re-opens every
      # private range the gateway can route to. Value is JSON: pydantic-settings
      # parses List[str] from env as JSON, not comma-separated.
      SSRF_ALLOWED_NETWORKS: '["172.30.97.0/24"]'
    volumes:
      # SQLite lives here. Without this, every restart forgets the servers you
      # registered.
      - gateway-data:/app/data
    depends_on:
      - clops-support
      - clops-session
    restart: unless-stopped

  clops-support:
    <<: *clops-agent
    environment:
      CLOPS_LIBRARY: ${CLOPS_LIBRARY:-clops.stdlib.business_designer}
      CLOPS_PORT: "9000"
      # The gateway rewrites tool names — `complete` is re-exposed as
      # `clops-support-complete` — but clops writes tool names *into the
      # dispatch prompts it returns*. Without this the prompts name
      # `mcp__clops__complete`, which is not on the subagent's tool list, and
      # every multi-step run stalls at its first step.
      #
      # The prefix must match the name this agent is registered under
      # (`./register-clops.sh clops-support`), because that is what the gateway
      # builds tool names from.
      CLOPS_TOOL_PATTERN: clops-support-{name_hyphenated}
      # `mcpgateway.translate` imports mcpgateway.config, which validates these
      # at import time — so the *bridge* needs them too, not just the gateway.
      # Found by running it: without these the agent container dies at startup
      # with SecurityConfigurationError. They must be >= 32 characters.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      AUTH_ENCRYPTION_SECRET: ${AUTH_ENCRYPTION_SECRET:?set AUTH_ENCRYPTION_SECRET in .env}

  clops-session:
    <<: *clops-agent
    environment:
      # The only meaningful difference from clops-support. Same image, different
      # Op set — `clops.stdlib.code_review` would be the obvious third, but it
      # does not import yet (its Ops are missing their required `Meta` strings).
      CLOPS_LIBRARY: clops.stdlib.session_analyzer
      CLOPS_PORT: "9000"
      CLOPS_TOOL_PATTERN: clops-session-{name_hyphenated}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      AUTH_ENCRYPTION_SECRET: ${AUTH_ENCRYPTION_SECRET:?set AUTH_ENCRYPTION_SECRET in .env}

networks:
  # Pinned, not left to Compose. The gateway's SSRF allowlist above names this
  # subnet literally, and Compose otherwise picks one per engine — OrbStack
  # handed out 192.168.97.0/24 where Docker Desktop uses 172.x — so an
  # unpinned network turns registration into a 422 on somebody else's machine.
  default:
    ipam:
      config:
        - subnet: 172.30.97.0/24

volumes:
  gateway-data:
