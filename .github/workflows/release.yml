name: Release

# Releases are MANUAL, and there are two ways to start one:
#
#   1. Publish a GitHub release (Releases → Draft a new release). This is the
#      normal path.
#   2. Actions → Release → "Run workflow", giving it an existing tag. Use this
#      to re-run after a failure, since a release can only be published once.
#
# There is deliberately no `push: tags` trigger. A PyPI version can never be
# reused or reverted, so cutting one has to be something a person chose to do,
# not something a `git push --tags` did on the way past. Publishing a release
# and clicking "Run workflow" are both that choice; pushing a tag is not.
#
# THE TAG IS THE VERSION. You do not bump anything by hand. The run rewrites
# every place the version is written — pyproject.toml, server.json, both plugin
# manifests, the README, two docstring examples — from the tag, before it builds
# anything, and afterwards opens a PR putting main in step. `scripts/set_version.py`
# holds the list of places; add a seventh there and this picks it up for free.
#
# What a run does, in order, stopping at the first failure:
#   - checks out the release's tag (not the branch it was dispatched from)
#   - writes the tag's version into every location
#   - runs the test suite
#   - builds the sdist + wheel
#   - installs the wheel into a clean venv with no lockfile and exercises it
#   - publishes clops-mcp to PyPI (trusted publishing / OIDC)
#   - creates a GitHub release, on the dispatch path only — on the release path
#     the release is what started the run and already exists
#   - opens a PR syncing the version back to main, unless it already matched
#
# To cut a release:
#   1. git tag -a vX.Y.Z -m "..." && git push origin vX.Y.Z
#   2. publish a GitHub release for that tag
#
# That is the whole thing. Publishing the release IS the authorisation — there
# is no second switch to set. For a dry run, tag a **pre-release** version
# (`X.Y.Zrc1`): the entire pipeline executes, and `uv tool install clops-mcp`
# will not resolve to it because pip and uv exclude pre-releases by default.
#
# One-time PyPI setup (trusted publishing — no token stored in the repo):
#   PyPI → your project (or "pending publisher") → Publishing → add a
#   GitHub Actions publisher:
#     Owner:    clops-mcp
#     Repo:     clops-mcp
#     Workflow: release.yml
#     Environment: (leave blank — this workflow does not use one)
#   See https://docs.pypi.org/trusted-publishers/
#
# Want a second pair of eyes on top of the manual trigger? Create a GitHub
# environment named `release` with yourself as a required reviewer, add
# `environment: release` to the job, and set Environment to `release` on the
# PyPI publisher above. Every run then waits for an explicit approval click.
# Both halves are required — changing only one breaks publishing.
#
# Token fallback (if you don't use trusted publishing): add a PYPI_API_TOKEN
# repo secret and replace the whole `uv publish` command with:
#   run: uv publish --token "${{ secrets.PYPI_API_TOKEN }}"
# (drop --trusted-publishing always along with it — that flag is what makes a
# missing OIDC config fail loudly instead of silently looking for a token.)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.4.0. Must already be pushed, and must match the version in pyproject.toml."
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # PyPI trusted publishing (OIDC)
      contents: write        # create the GitHub release, push the sync branch
      pull-requests: write   # open the version-sync PR
    env:
      # One name for the tag whichever trigger fired. `inputs.tag` is empty on
      # the release path, `github.event.release` is empty on the dispatch path.
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      # This workflow uses NO third-party actions, by policy: the org requires
      # actions to be owned by clops-mcp and pinned to a full-length SHA, which
      # rules out actions/checkout and astral-sh/setup-uv. Doing both by hand is
      # a dozen lines and, for a job holding `id-token: write` against PyPI,
      # removes the one class of supply-chain risk that could publish as us.
      #
      # Checks out the TAG, not the branch. Under workflow_dispatch the default
      # ref is the branch it was dispatched from, so without this the job builds
      # whatever is on main and publishes it under the tag's name — silently
      # divergent the moment anything lands after the tag.
      - name: Check out the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # Auth as a header rather than in the remote URL, so the token is not
          # sitting in .git/config for every later command to echo. Reads are
          # anonymous on a public repo; this is here for the sync-branch push.
          git config --local "http.https://github.com/.extraheader" \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # Full history, not --depth 1: the sync step branches from this commit
          # and pushes, and pushing from a shallow clone is rejected.
          git fetch -q --tags origin
          git checkout -q --detach "${TAG}"
          echo "Checked out $(git rev-parse --short HEAD) (${TAG})"

      - name: Install uv
        # Pinned exactly. `curl | sh` from astral.sh would satisfy the letter of
        # the policy while reintroducing exactly what it is trying to prevent —
        # an unpinned third-party fetch in a job that can publish to PyPI.
        # Installed into its own venv because the runner's system Python is
        # externally managed and rejects a plain `pip install`.
        env:
          UV_VERSION: "0.12.5"
        run: |
          python3 -m venv /tmp/uvenv
          /tmp/uvenv/bin/pip install --quiet --disable-pip-version-check "uv==${UV_VERSION}"
          echo /tmp/uvenv/bin >> "$GITHUB_PATH"
          /tmp/uvenv/bin/uv --version

      - name: Set the version from the tag
        # The tag is the source of truth. Every place the version is written
        # gets rewritten from it before anything is built, so a release cannot
        # ship a version that disagrees with the thing that named it — and
        # nobody has to hand-edit six files before tagging.
        #
        # Two guards, because "the tag is the version" removes the old
        # mismatch check and a typo would otherwise publish permanently:
        # the tag must be a PEP 440 version, and it must not be older than what
        # is committed. Neither catches every fat-finger, but together they
        # catch re-tagging an old release, which is the likely one.
        run: |
          uv run --no-project --with packaging python - <<'PY'
          import os, sys
          from packaging.version import InvalidVersion, Version

          sys.path.insert(0, "scripts")
          import set_version

          tag = os.environ["TAG"]
          try:
              new = Version(tag.removeprefix("v"))
          except InvalidVersion:
              print(f"::error::tag {tag} is not a PEP 440 version")
              raise SystemExit(1)

          committed = set_version.LOCATIONS[0].read()
          if new < Version(committed):
              print(
                  f"::error::tag {tag} is older than the committed version "
                  f"{committed}. Releasing it would publish a version that "
                  "goes backwards."
              )
              raise SystemExit(1)

          print(f"Releasing clops-mcp {new} from {tag}")
          changed = set_version.write_all(str(new))
          for path in changed:
              print(f"  rewrote {path}")
          if not changed:
              print("  (every location already agreed)")
          PY

      - name: Run tests
        run: uv run --extra dev pytest -q

      - name: Build sdist + wheel
        run: uv build

      # The tests above run against uv.lock. That is exactly how the mcp 2.0.0
      # break slipped through: the lockfile pinned 1.27.0, so nobody here saw
      # what a fresh `pip install` resolves. This step installs the built wheel
      # with no lockfile at all — the resolution a PyPI user actually gets —
      # and exercises the entry points. It runs before publishing, on purpose.
      - name: Smoke-test the built wheel against an unlocked resolution
        run: |
          uv venv /tmp/smoke --python 3.12
          VIRTUAL_ENV=/tmp/smoke uv pip install --no-cache dist/*.whl
          # -P is load-bearing. `python -` puts the CURRENT DIRECTORY on
          # sys.path, and this job runs from the repo checkout — so `import
          # clops` resolves to ./clops/, the source tree, and this entire step
          # silently tests the thing it was written to not test. -P (3.11+)
          # drops the cwd entry; the assertion below proves it worked rather
          # than trusting it.
          /tmp/smoke/bin/python -P - <<'PY'
          import importlib, importlib.metadata as md, pkgutil
          import clops
          # "site-packages", not a /tmp/smoke prefix: the venv path is resolved
          # differently across platforms (macOS turns /tmp into /private/tmp),
          # and what actually matters is that this came from an install rather
          # than from a checkout.
          assert "site-packages" in clops.__file__, (
              f"imported clops from {clops.__file__} — expected the installed "
              "wheel. The source tree is shadowing it."
          )
          import clops.runtime.mcp_server  # constructs against the resolved mcp
          import clops.cli.init as init
          print("clops imported from", clops.__file__)
          print("mcp resolved to", md.version("mcp"))
          assert init.CLOPS_EXECUTOR_SRC.exists(), "packaged agent .md missing from wheel"
          assert init.SKILL_SRC.exists(), "packaged skill .md missing from wheel"

          # Every bundled library must import *from the installed wheel*. Two
          # distinct failures hide here, both release-blocking and both
          # invisible until someone installs the thing: a library whose files
          # never made it into the wheel, and a library that raises on import
          # regardless of packaging. `code_review` shipped in the second state
          # — every one of its Ops was missing the required `Meta` string, so
          # importing it raised TypeError — and nothing in this job noticed.
          import clops.example_library
          libs = [m.name for m in pkgutil.iter_modules(clops.example_library.__path__)]
          assert libs, "no bundled libraries in the wheel"
          for name in libs:
              importlib.import_module(f"clops.example_library.{name}")
          print("bundled libraries import:", ", ".join(sorted(libs)))
          PY
          /tmp/smoke/bin/clops --help > /dev/null
          # NB: don't invoke clops-server/clops-hook here — they have no --help
          # path; they'd start the stdio server and hang the job. Assert the
          # console scripts were installed instead.
          test -x /tmp/smoke/bin/clops-server
          test -x /tmp/smoke/bin/clops-hook

      # Publishing a GitHub release is the gate. There is no second switch — a
      # repo variable that has to be set for a release to actually release is a
      # thing you forget, and forgetting it produces a green run that published
      # nothing. Everything above this line has to pass first; this is simply
      # the last step.
      - name: Publish to PyPI
        # --trusted-publishing always: fail loudly if OIDC isn't configured
        # rather than falling back to hunting for credentials that aren't there.
        # --check-url: makes a re-run after a partial failure skip files already
        # uploaded, instead of dying on "file already exists".
        run: |
          uv publish \
            --trusted-publishing always \
            --check-url https://pypi.org/simple/clops-mcp/

      # Dispatch path only. On the release path the release is what started this
      # run, so creating one would fail on "release already exists" and turn a
      # successful publish into a red run.
      - name: Create GitHub release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        # --verify-tag: refuse to invent a tag. Without it, a typo in the input
        # creates a release pointing at a tag that does not exist.
        run: gh release create "${TAG}" --generate-notes --verify-tag

      # The build rewrote the version in the checkout; main still has whatever
      # was committed. This puts the two back in step without anyone editing
      # anything, and opens a PR rather than pushing, so nothing reaches main
      # unreviewed.
      #
      # No-ops when the versions already agreed — which is the case when the
      # bump was merged before tagging. So both workflows are supported: bump
      # first and this stays quiet, or just tag and let it catch main up.
      - name: Open a PR syncing the version back to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "main is already at ${TAG} — nothing to sync."
            exit 0
          fi

          version="${TAG#v}"
          branch="chore/sync-version-${version}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Branch off the tag we built, so the PR carries the released
          # version and nothing else.
          git switch -c "$branch"
          git commit -aqm "Set the version to ${version}

          Written by the release workflow from tag ${TAG}. The release itself
          already shipped with these values; this is main catching up."
          git push -q origin "$branch"
          gh pr create \
            --base main --head "$branch" \
            --title "Set the version to ${version}" \
            --body "Opened by the release workflow after publishing \`${TAG}\`.

          The released artifacts were built with \`${version}\` in every
          location. This brings \`main\` into line — no behaviour change, and
          nothing here was hand-written.

          Generated by \`scripts/set_version.py\`."
